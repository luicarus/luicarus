name: Update README cards

on:
  schedule:
    # 每天 UTC 3:00（北京时间 11:00）自动刷新
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          # exclude_repo: 排除 fork 上游（ray / TensorRT），避免他人代码主导统计
          # hide: 屏蔽 Shell 与 PowerShell（环境配置类脚手架代码，不代表技术栈）
          # size_weight/count_weight: 代码量与仓库数各占一半，避免单一巨型仓库主导
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&theme=transparent&hide_border=true&exclude_repo=ray,TensorRT&hide=Shell,PowerShell&size_weight=0.5&count_weight=0.5
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
